<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">From a pinned itinerary to a verdict: resolver, six research agents, hard stops in code, synthesizer, critic.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A9693"/>
    </marker>
  </defs>
  <g stroke="#8A9693" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <path d="M250,320 L310,320"/>
    <path d="M530,320 L590,250"/>
    <path d="M530,320 L590,320"/>
    <path d="M530,320 L590,390"/>
    <path d="M860,250 L920,320"/>
    <path d="M860,320 L920,320"/>
    <path d="M860,390 L920,320"/>
    <path d="M1130,320 L1190,320"/>
    <path d="M1300,260 L1300,210"/>
    <path d="M1300,440 L1300,380"/>
  </g>
  <g>
    <rect x="40" y="270" width="210" height="100" rx="14" fill="#2A5F58"/>
    <text x="145" y="312" text-anchor="middle" fill="#F4F6F5" font-size="26" font-weight="600">Itinerary</text>
    <text x="145" y="344" text-anchor="middle" fill="#CFE3DF" font-size="18">dates, points, route band</text>
  </g>
  <g>
    <rect x="310" y="270" width="220" height="100" rx="14" fill="#2A5F58"/>
    <text x="420" y="312" text-anchor="middle" fill="#F4F6F5" font-size="26" font-weight="600">Resolver</text>
    <text x="420" y="344" text-anchor="middle" fill="#CFE3DF" font-size="18">one source bundle per day</text>
  </g>
  <g fill="#F4F6F5" font-size="22" font-weight="600" text-anchor="middle">
    <rect x="590" y="130" width="270" height="56" rx="12" fill="#3F7F76"/><text x="725" y="166">Access</text>
    <rect x="590" y="198" width="270" height="56" rx="12" fill="#3F7F76"/><text x="725" y="234">Sky</text>
    <rect x="590" y="266" width="270" height="56" rx="12" fill="#3F7F76"/><text x="725" y="302">Ground</text>
    <rect x="590" y="334" width="270" height="56" rx="12" fill="#3F7F76"/><text x="725" y="370">Snow</text>
    <rect x="590" y="402" width="270" height="56" rx="12" fill="#3F7F76"/><text x="725" y="438">Clock</text>
    <rect x="590" y="470" width="270" height="56" rx="12" fill="#3F7F76"/><text x="725" y="506">Contingency</text>
  </g>
  <text x="725" y="100" text-anchor="middle" fill="#8A9693" font-size="18">six research agents, readings with a source and an as-of</text>
  <g>
    <rect x="920" y="270" width="210" height="100" rx="14" fill="#E07A5F"/>
    <text x="1025" y="312" text-anchor="middle" fill="#F4F6F5" font-size="26" font-weight="600">Hard stops</text>
    <text x="1025" y="344" text-anchor="middle" fill="#FBE4DC" font-size="18">applied in code, never argued</text>
  </g>
  <g>
    <rect x="1190" y="270" width="220" height="100" rx="14" fill="#2A5F58"/>
    <text x="1300" y="312" text-anchor="middle" fill="#F4F6F5" font-size="26" font-weight="600">Synthesizer</text>
    <text x="1300" y="344" text-anchor="middle" fill="#CFE3DF" font-size="18">weighs what is left</text>
  </g>
  <g>
    <rect x="1190" y="140" width="220" height="70" rx="14" fill="none" stroke="#2A5F58" stroke-width="3"/>
    <text x="1300" y="172" text-anchor="middle" fill="#2A5F58" font-size="24" font-weight="600">Verdict</text>
    <text x="1300" y="198" text-anchor="middle" fill="#8A9693" font-size="16">Go, caveats, Wait, No-go</text>
  </g>
  <g>
    <rect x="1190" y="440" width="220" height="70" rx="14" fill="none" stroke="#8A9693" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="1300" y="472" text-anchor="middle" fill="#8A9693" font-size="24" font-weight="600">Critic</text>
    <text x="1300" y="498" text-anchor="middle" fill="#8A9693" font-size="16">one revision, at most</text>
  </g>
  <text x="1025" y="420" text-anchor="middle" fill="#8A9693" font-size="16">a hit sets the floor</text>
  <text x="1025" y="442" text-anchor="middle" fill="#8A9693" font-size="16">the verdict cannot rise above</text>
</svg>
